<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schaerer 咖啡机维修助手 - Art Plus Best Foam</title>
<style>
:root {
  --primary: #4A3728; --primary-light: #6B5344; --accent: #C8A26D;
  --accent-light: #F5E6D3; --bg: #FAF8F5; --sidebar-bg: #3C2D20;
  --sidebar-hover: #504438; --card-bg: #FFF; --text: #2C2418;
  --text-light: #6B5E4F; --text-lighter: #9E9182; --border: #E8E0D5;
  --danger: #C0392B; --warning: #E67E22; --success: #27AE60; --info: #2980B9;
  --shadow: 0 2px 12px rgba(0,0,0,0.06); --radius: 10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sidebar-bg);color:#DDD;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo .brand{font-size:16px;font-weight:700;color:#FFF;display:block}
.sidebar-logo .subtitle{font-size:11px;color:var(--accent);margin-top:2px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;font-size:15px;color:#B0A89C;border-left:3px solid transparent;transition:all 0.2s}
.nav-item:hover{background:var(--sidebar-hover);color:#FFF}
.nav-item.active{background:var(--sidebar-hover);color:#FFF;border-left-color:var(--accent)}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:#70655A}
.main{margin-left:220px;flex:1;min-height:100vh}
.header{background:#FFF;padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:18px;font-weight:700}
.user-badge{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-light)}
.user-avatar{width:30px;height:30px;background:var(--primary);color:#FFF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.content{padding:24px 28px}
.page{display:none}
.page.active{display:block}

/* Search area */
.search-hero{text-align:center;padding:40px 20px}
.search-hero h2{font-size:24px;margin-bottom:8px;color:var(--primary)}
.search-hero .sub{color:var(--text-light);font-size:14px;margin-bottom:28px}
.search-bar{display:flex;max-width:640px;margin:0 auto;gap:0;border:2px solid var(--primary);border-radius:var(--radius);overflow:hidden;background:#FFF}
.search-bar input{flex:1;padding:14px 20px;border:none;outline:none;font-size:16px;color:var(--text)}
.search-bar input::placeholder{color:var(--text-lighter)}
.search-bar button{padding:14px 28px;background:var(--primary);color:#FFF;border:none;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-bar button:hover{background:var(--primary-light)}

/* Result cards */
.result-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.result-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.result-title{font-size:18px;font-weight:700}
.result-meta{font-size:13px;color:var(--text-light);margin-top:4px}
.result-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600}
.badge-subsystem{background:var(--accent-light);color:var(--primary)}
.badge-seq{background:rgba(39,174,96,0.1);color:var(--success)}
.badge-code{background:var(--bg);color:var(--text-light);font-family:monospace;font-size:11px}

/* Image viewer */
.image-viewer{position:relative;display:inline-block;max-width:100%;cursor:zoom-in;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.image-viewer img{display:block;max-width:100%;height:auto}
.image-viewer canvas{position:absolute;top:0;left:0;pointer-events:none}

/* Subsystem grid */
.subsystem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.subsystem-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all 0.2s;text-align:center}
.subsystem-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(200,162,109,0.15)}
.subsystem-card .icon{font-size:14px;font-weight:700;color:#fff;background:var(--primary);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.subsystem-card .name{font-size:13px;font-weight:600}
.subsystem-card .count{font-size:11px;color:var(--text-lighter);margin-top:2px}

/* Parts table */
.parts-table{width:100%;border-collapse:collapse;font-size:13px}
.parts-table th{text-align:left;padding:10px 14px;background:var(--bg);font-weight:600;color:var(--text-light);border-bottom:2px solid var(--border);white-space:nowrap}
.parts-table td{padding:10px 14px;border-bottom:1px solid var(--border)}
.parts-table tr:hover td{background:var(--bg)}
.parts-table tr.highlight td{background:var(--accent-light)}

/* Fault flow */
.fault-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.fault-card .fault-header{background:rgba(192,57,43,0.05);padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.fault-header .icon{font-size:22px}
.fault-header h3{font-size:16px}
.fault-header .machine{font-size:12px;color:var(--text-lighter);margin-left:auto}
.fault-steps{padding:16px 20px}
.fault-step{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--border);align-items:flex-start}
.fault-step:last-child{border-bottom:none}
.step-num{width:28px;height:28px;background:var(--primary);color:#FFF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.step-content{flex:1}
.step-part{font-weight:600;font-size:14px;margin-bottom:2px}
.step-part .code{font-family:monospace;font-size:12px;color:var(--text-light);font-weight:400;margin-left:8px}
.step-solution{font-size:13px;color:var(--text-light);line-height:1.6}

/* Quick tips */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-lighter)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state h4{font-size:16px;color:var(--text-light);margin-bottom:6px}

.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab{padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-light);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.btn{padding:9px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#FFF}
.btn-primary:hover{background:var(--primary-light)}
.btn-outline{background:#FFF;color:var(--primary);border:1px solid var(--primary)}
.btn-sm{padding:5px 12px;font-size:12px}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .header{padding:12px 14px}
  .content{padding:16px}
  .search-hero h2{font-size:18px}
}
</style>
</head>

    </div>
  </div>
</div>

  renderSubsystemGrid();
  renderFaultTabs();
  document.getElementById('partSearch').focus();
}

// ===== NAVIGATION =====
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = item.dataset.page;
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('pageTitle').textContent = 
      {search:'零件搜索',catalog:'爆炸图目录',fault:'故障维修指南',records:'维修记录'}[page];
    currentMode = page;
    if (page === 'search') document.getElementById('partSearch').focus();
    if (page === 'records') renderRecords();
  });
});

// ===== PART SEARCH =====
function normalizeCode(code) {
  // Only strip non-alphanumeric characters (dots, spaces), do NOT strip 33700 prefix
  return code.replace(/\s/g,'').replace(/\./g,'');
}

function searchPart() {
  const q = document.getElementById('partSearch').value.trim();
  if (!q || !appData) return;
  
  document.getElementById('searchEmpty').style.display = 'none';
  const container = document.getElementById('searchResult');
  
  const ql = q.toLowerCase();
  const qNorm = normalizeCode(q);
  
  let results = appData.parts.filter(p => {
    // Exact GS code match (only if gsCode is non-empty)
    if (p.gsCode && p.gsCode.toLowerCase() === ql) return true;
    
    const numNorm = normalizeCode(p.numCode);
    // Exact numeric match (new code or old code)
    if (p.numCode === q || numNorm === qNorm) return true;
    if (p.oldNum && p.oldNum === q) return true;
    
    // Match by explosion diagram short codes (old format)
    if (p.numCode.length > 4 && (p.numCode.endsWith(q) || ('33700'+q) === p.numCode)) return true;
    
    // Name search (only if query has Chinese or is longer than 4 chars)
    if (ql.length > 4 || /[\u4e00-\u9fff]/.test(q)) {
      if (p.name.toLowerCase().includes(ql)) return true;
    }
    return false;
  });
  
  // Also search in fault flow data
  if (results.length === 0 && appData.faultFlows) {
    for (const [mn, flow] of Object.entries(appData.faultFlows)) {
      for (const step of flow.steps) {
        if (step.partNum === q || normalizeCode(step.partNum) === qNorm) {
          results = appData.parts.filter(p => p.name.includes(step.partName) || p.numCode.includes(q));
          if (results.length === 0) {
            // Create a virtual result
            results = [{
              gsCode: '', numCode: step.partNum, name: step.partName,
              subsystem: '维修指南-' + mn, image: null, seq: step.step.toString()
            }];
          }
          break;
        }
      }
    }
  }
  
  // If no results, try fuzzy name
  if (results.length === 0 && ql.length >= 2) {
    results = appData.parts.filter(p => p.name.toLowerCase().includes(ql));
  }
  
  if (results.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h4>未找到匹配零件</h4><p>尝试使用 GS 编号或数字编码搜索</p><p style="font-size:12px;margin-top:8px;color:var(--text-lighter)">例：GS01220-01、061226、33.2263.8100</p></div>`;
    return;
  }
  
  const labels = {'外观':'第一部分','内部结构':'第二部分','豆仓':'第三部分','研磨器':'第四部分','水泵':'第五部分','进水系统':'第六部分','热水系统':'第七部分','蒸汽系统':'第八部分','锅炉':'第九部分','冲泡器':'第十部分','出口':'第十一部分','蒸汽棒':'第十二部分','电路板':'第十三部分','控制面板':'第十四部分','牛奶系统':'第十五部分','干粉系统':'第十六部分','其它':'第十七部分'};
  
  container.innerHTML = results.slice(0, 20).map((p, idx) => {
    const hasImg = p.subsystem && p.image;
    const isFirst = idx === 0;
    const baseName = (p.subsystem || '').replace(/（模块\d+）/,'');
    const partLabel = labels[baseName] || '';
    const fullTitle = partLabel ? `${partLabel} ${baseName} ${p.name}` : `${p.subsystem || ''} ${p.name}`;
    
    return `<div class="result-card" id="result-${idx}">
      <div class="result-header">
        <div>
          <div class="result-title">${fullTitle}</div>
          <div class="result-meta">
            <span style="color:var(--text-light)">旧料号<code style="background:var(--bg);padding:2px 8px;border-radius:4px;margin-left:4px">${p.oldNum}</code></span>
            <span style="margin:0 10px;color:var(--text-lighter)">|</span>
            <span style="color:var(--text-light)">新料号<code style="background:var(--bg);padding:2px 8px;border-radius:4px;margin-left:4px">${p.numCode}</code></span>
          </div>
        </div>
        <div class="result-badges">
          ${p.subsystem ? `<span class="badge badge-subsystem">📐 ${p.subsystem}</span>` : ''}
          ${p.seq ? `<span class="badge badge-seq">#${p.seq}</span>` : ''}
        </div>
      </div>
      ${hasImg ? renderImageViewer(p) : 
        '<div style="background:var(--bg);border-radius:8px;padding:20px;text-align:center;color:var(--text-lighter);font-size:13px">此零件暂未关联到爆炸图子系统</div>'}
    </div>`;
  }).join('');
  
  // Scroll to first result
  setTimeout(() => {
    const first = document.getElementById('result-0');
    if (first) first.scrollIntoView({behavior:'smooth',block:'start'});
  }, 100);
  
  if (results.length > 20) {
    container.innerHTML += `<div style="text-align:center;padding:12px;color:var(--text-lighter);font-size:13px">显示前 20 个结果，共 ${results.length} 个匹配</div>`;
  }
  
  // Initialize OCR box annotations after DOM update
  setTimeout(() => {
    document.querySelectorAll('#searchResult .ocr-box').forEach(box => {
      const img = box.parentElement.querySelector('img');
      if (!img) return;
      function positionBox() {
        const imgW = img.naturalWidth || img.width || 800;
        const imgH = img.naturalHeight || img.height || 600;
        const displayW = img.clientWidth;
        const displayH = img.clientHeight;
        const scaleX = displayW / imgW;
        const scaleY = displayH / imgH;
        const x = parseFloat(box.dataset.x);
        const y = parseFloat(box.dataset.y);
        const w = parseFloat(box.dataset.w);
        const h = parseFloat(box.dataset.h);
        box.style.left = ((x - 10) * scaleX) + 'px';
        box.style.top = ((y - 10) * scaleY) + 'px';
        box.style.width = ((w + 20) * scaleX) + 'px';
        box.style.height = ((h + 20) * scaleY) + 'px';
      }
      if (img.complete) { positionBox(); }
      else { img.addEventListener('load', positionBox); }
    });
  }, 200);
}

function renderImageViewer(p) {
  const imgId = 'img-' + p.numCode;
  const canvasId = 'canvas-' + p.numCode;
  const imgFile = p.image.replace(/^.*\//, '');  // 提取文件名如 "image3.png"
  
  // Check if we have OCR position for this part
  const mappings = appData.ocrMappings && appData.ocrMappings[imgFile];
  const pos = mappings && (mappings[p.oldNum] || mappings[p.numCode] || mappings[p.numCode.replace(/\./g,'')]);
  
  const hasOcr = !!pos;
  const boxHtml = hasOcr 
    ? `<div class="ocr-box" style="position:absolute;border:3px dashed #C0392B;pointer-events:none;z-index:10;box-sizing:border-box;" data-x="${pos.x}" data-y="${pos.y}" data-w="${pos.w}" data-h="${pos.h}"></div>`
    : '';
  
  return `<div style="margin-top:12px">
    <div class="image-viewer" id="viewer-${p.numCode}" style="width:100%;max-height:500px;overflow:auto">
      <div style="position:relative;display:inline-block" class="img-wrapper">
        <img src="${p.image}" alt="${p.subsystem}" id="${imgId}" 
          style="display:block;max-width:100%;min-width:600px;cursor:zoom-in"
          onclick="window.open(this.src,'_blank')">
        ${boxHtml}
      </div>
    </div>
    <div style="margin-top:6px;font-size:11px;color:var(--text-lighter)">
      💡 点击图片可放大查看 ${hasOcr ? '| 🔴 红框标注当前零件位置' : ''}
    </div>
  </div>`;
}

function annotateImageLegacy(imgId, xPct, yPct, seq, gsCode) {
  const img = document.getElementById(imgId);
  if (!img || !img.complete) return;
  
  const canvas = document.getElementById('canvas-' + gsCode);
  if (!canvas) return;
  
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  canvas.style.width = img.style.width || img.width + 'px';
  canvas.style.height = img.style.height || img.height + 'px';
  
  const ctx = canvas.getContext('2d');
  const cx = (xPct / 100) * canvas.width;
  const cy = (yPct / 100) * canvas.height;
  const boxW = Math.max(60, canvas.width * 0.08);
  const boxH = Math.max(40, canvas.height * 0.06);
  const x = Math.max(0, Math.min(canvas.width - boxW, cx - boxW/2));
  const y = Math.max(0, Math.min(canvas.height - boxH, cy - boxH/2));
  
  // Draw red rectangle with animation effect
  ctx.strokeStyle = '#C0392B';
  ctx.lineWidth = Math.max(3, canvas.width * 0.004);
  ctx.setLineDash([8, 4]);
  ctx.strokeRect(x, y, boxW, boxH);
  
  // Draw corner brackets
  ctx.setLineDash([]);
  const cornerLen = 15;
  ctx.strokeStyle = '#FF0000';
  ctx.lineWidth = 2.5;
  // Top-left
  ctx.beginPath(); ctx.moveTo(x, y+cornerLen); ctx.lineTo(x, y); ctx.lineTo(x+cornerLen, y); ctx.stroke();
  // Top-right
  ctx.beginPath(); ctx.moveTo(x+boxW-cornerLen, y); ctx.lineTo(x+boxW, y); ctx.lineTo(x+boxW, y+cornerLen); ctx.stroke();
  // Bottom-left
  ctx.beginPath(); ctx.moveTo(x, y+boxH-cornerLen); ctx.lineTo(x, y+boxH); ctx.lineTo(x+cornerLen, y+boxH); ctx.stroke();
  // Bottom-right
  ctx.beginPath(); ctx.moveTo(x+boxW-cornerLen, y+boxH); ctx.lineTo(x+boxW, y+boxH); ctx.lineTo(x+boxW, y+boxH-cornerLen); ctx.stroke();
  
  // Label
  const label = '#' + seq;
  ctx.font = `bold ${Math.max(14, canvas.width*0.025)}px sans-serif`;
  ctx.fillStyle = '#C0392B';
  const textW = ctx.measureText(label).width;
  const labelX = x + boxW/2 - textW/2;
  const labelY = y - 8;
  // Background
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(labelX - 4, labelY - ctx.font.split('px')[0] * 0.8, textW + 8, parseInt(ctx.font) * 1.2);
  ctx.fillStyle = '#C0392B';
  ctx.fillText(label, labelX, labelY);
  
  // Animated pulse
  let pulse = 0;
  const animate = () => {
    pulse += 0.02;
    ctx.strokeStyle = `rgba(255,0,0,${0.3 + Math.sin(pulse) * 0.3})`;
    ctx.lineWidth = Math.max(4, canvas.width * 0.006);
    ctx.setLineDash([]);
    ctx.strokeRect(x - 4, y - 4, boxW + 8, boxH + 8);
    if (pulse < Math.PI * 2) requestAnimationFrame(animate);
  };
  animate();
}

  if (!appData) return 30;
  const sub = appData.subsystems.find(s => s.name === subsystemName);

// ===== FAULT FLOW =====
function renderFaultTabs() {
  if (!appData) return;
  const tabs = document.getElementById('faultTabs');
  const machines = Object.keys(appData.faultFlows || {});
  if (machines.length === 0) {
    tabs.innerHTML = '<div style="padding:20px;color:var(--text-lighter);text-align:center">暂无故障维修指南数据</div>';
    return;
  }
  tabs.innerHTML = machines.map((m, i) => 
    `<div class="tab ${i===0?'active':''}" onclick="showFaultFlow('${m}')">🤖 机型 ${i+1}</div>`
  ).join('');
  
  if (machines.length > 0) showFaultFlow(machines[0]);
}

function showFaultFlow(machine) {
  if (!appData) return;
  document.querySelectorAll('#faultTabs .tab').forEach(t => {
    t.classList.toggle('active', t.textContent.includes(machine) || t.onclick.toString().includes(machine));
  });
  
  const flow = appData.faultFlows[machine];
  if (!flow) return;
  
  document.getElementById('faultDetail').innerHTML = `
    <div class="fault-card">
      <div class="fault-header">
        <span class="icon">💧</span>
        <h3>故障排查方案</h3>
        <span class="machine">🤖 机型 ${machine}</span>
      </div>
      <div class="fault-steps">
        ${flow.steps.map(s => `
          <div class="fault-step">
            <div class="step-num">${s.step}</div>
            <div class="step-content">
              <div class="step-part">
                ${s.partName}
                <span class="code" style="cursor:pointer;text-decoration:underline;color:var(--info)"

                  ${s.partNum}
                </span>

              <div class="step-solution">${s.solution}</div>

function navigateToTab(tab) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector(`[data-page="${tab}"]`).classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('pageTitle').textContent = {search:'零件搜索',catalog:'爆炸图目录',fault:'故障维修指南',records:'维修记录'}[tab];
}

// ===== REPAIR RECORDS =====
function renderRecords() {
  const container = document.getElementById('recordsContainer');
  if (repairRecords.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><h4>暂无维修记录</h4></div>';
    return;
  }
  
  container.innerHTML = `
    <table class="parts-table">
      <thead><tr><th>日期</th><th>门店</th><th>零件编号</th><th>零件名称</th><th>故障现象</th><th>方案</th><th>耗时(h)</th><th>操作</th></tr></thead>
      <tbody>${[...repairRecords].reverse().map(r => `<tr>
        <td>${r.date||'--'}</td><td>${r.store||'--'}</td>
        <td><code>${r.partNum||'--'}</code></td>
        <td>${getPartName(r.partNum)}</td>
        <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.desc||'--'}</td>
        <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.solution||'--'}</td>
        <td>${r.duration||'--'}</td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="editRecord('${r.id}')">编辑</button>
          <button class="btn btn-outline btn-sm" style="color:var(--danger);margin-left:4px" onclick="deleteRecord('${r.id}')">删除</button>
        </td>
      </tr>`).join('')}</tbody>
    </table>
    <div style="margin-top:12px">
      <button class="btn btn-outline btn-sm" onclick="exportRecords()">📥 导出CSV</button>
    </div>`;
}

function getPartName(num) {
  if (!appData || !num) return '--';
  const p = appData.parts.find(p => p.gsCode === num || p.numCode === num || p.oldNum === num);
  return p ? p.name : (num || '--');
}

function openRecordModal(recId) {
  editingRecordId = recId;
  document.getElementById('recordModalTitle').textContent = recId ? '编辑维修记录' : '新建维修记录';
  document.getElementById('recordModal').style.display = 'flex';
  
  if (recId) {
    const r = repairRecords.find(x => x.id === recId);
    if (r) {
      document.getElementById('recDate').value = r.date || '';
      document.getElementById('recStore').value = r.store || '';
      document.getElementById('recPartNum').value = r.partNum || '';
      document.getElementById('recDesc').value = r.desc || '';
      document.getElementById('recSolution').value = r.solution || '';
      document.getElementById('recDuration').value = r.duration || '';
    }
  } else {
    document.getElementById('recDate').value = new Date().toISOString().split('T')[0];
    ['recStore','recPartNum','recDesc','recSolution','recDuration'].forEach(id => document.getElementById(id).value = '');
  }
}

function closeRecordModal() {
  document.getElementById('recordModal').style.display = 'none';
  editingRecordId = null;
}

function saveRecord() {
  const record = {
    id: editingRecordId || 'R' + Date.now(),
    date: document.getElementById('recDate').value,
    store: document.getElementById('recStore').value,
    partNum: document.getElementById('recPartNum').value,
    desc: document.getElementById('recDesc').value,
    solution: document.getElementById('recSolution').value,
    duration: document.getElementById('recDuration').value
  };
  
  if (!record.partNum) { alert('请填写零件编号'); return; }
  
  if (editingRecordId) {
    const idx = repairRecords.findIndex(r => r.id === editingRecordId);
    if (idx >= 0) repairRecords[idx] = record;
  } else {
    repairRecords.push(record);
  }
  
  localStorage.setItem('luckin_repair_v2', JSON.stringify(repairRecords));
  closeRecordModal();
  renderRecords();
}

function editRecord(id) { openRecordModal(id); }

function deleteRecord(id) {
  if (!confirm('确定删除？')) return;
  repairRecords = repairRecords.filter(r => r.id !== id);
  localStorage.setItem('luckin_repair_v2', JSON.stringify(repairRecords));
  renderRecords();
}

function exportRecords() {
  if (repairRecords.length === 0) return;
  const csv = '日期,门店,零件编号,零件名称,故障现象,处理方案,耗时(h)\n' +
    repairRecords.map(r => [r.date,r.store,r.partNum,getPartName(r.partNum),r.desc,r.solution,r.duration].join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `咖啡机维修记录_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

// Close modal on overlay click
document.getElementById('recordModal').addEventListener('click', function(e) {
  if (e.target === this) closeRecordModal();
});

// Auto-init on page load
init();
